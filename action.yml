name: "GodScore CI"
description: "Constraint-based governance score with memory. AutoScore v1 + GV spine. Optional enforcement."

inputs:
  runtime_mode:
    description: "Enable runtime irreversibility signal"
    required: false
    default: "false"
  runtime_threshold:
    description: "Minimum runtime godscore (0-100)"
    required: false
    default: "50"
  runtime_enforce:
    description: "Fail build if runtime score is below runtime_threshold"
    required: false
    default: "false"

  score:
    description: "Optional. 0..1 or 0..100. Omit or set to 'auto' to compute AutoScore v1 -> GV -> GodScore."
    required: false
  threshold:
    description: "Minimum GodScore required. 0..1 or 0..100."
    required: false
    default: "0.80"
  mode:
    description: "free | pro"
    required: false
    default: "free"
  enforce:
    description: "true/false. In pro mode, fail if below threshold."
    required: false
    default: "false"

outputs:
  godscore:
    description: "Computed GodScore (0..1)."
    value: ${{ steps.godscore_run.outputs.godscore }}
  gv:
    description: "Computed GV (0..1)."
    value: ${{ steps.godscore_run.outputs.gv }}
  passed:
    description: "true if score >= threshold."
    value: ${{ steps.godscore_run.outputs.passed }}
  effective_mode:
    description: "free or pro."
    value: ${{ steps.godscore_run.outputs.effective_mode }}
  score_source:
    description: "manual or auto."
    value: ${{ steps.godscore_run.outputs.score_source }}

runs:
  using: "composite"
  steps:
    - name: "Set up Python"
      uses: actions/setup-python << 'PY'

# === RUNTIME SIGNAL INTEGRATION ===
import json
from pathlib import Path

runtime_file = Path("outputs/runtime_signal/runtime_signal_input_summary.json")

runtime_score = None
if runtime_file.exists():
    data = json.loads(runtime_file.read_text())
    runtime_score = data.get("godscore_runtime")

# fallback if missing
if runtime_score is None:
    runtime_score = 100

# blend with base score (simple min for now)
final_score = min(score, runtime_score)

print(f"Base score: {score}")
print(f"Runtime score: {runtime_score}")
print(f"Final score: {final_score}")

score = final_score

# === RUNTIME ENFORCEMENT ===
import os

runtime_threshold = int(os.environ.get("INPUT_RUNTIME_THRESHOLD", "50"))
runtime_enforce = os.environ.get("INPUT_RUNTIME_ENFORCE", "false").lower() == "true"

print(f"[runtime] threshold={runtime_threshold}")
print(f"[runtime] enforce={runtime_enforce}")

if runtime_enforce:
    print(f"[runtime] checking score {runtime_score} < {runtime_threshold}")
    if runtime_score < runtime_threshold:
        raise SystemExit(
            f"❌ Runtime enforcement FAILED: {runtime_score} < {runtime_threshold}"
        )
    else:
        print("✅ Runtime enforcement PASSED")

# === END RUNTIME ENFORCEMENT ===



# === END RUNTIME SIGNAL ===

