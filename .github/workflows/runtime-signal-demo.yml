name: Runtime Signal Demo

on:
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt

      - name: Run monitor
        run: python scripts/runtime_monitor.py

      - name: Drift check
        run: python scripts/runtime_drift_check.py

      - name: Adaptive threshold
        run: python scripts/runtime_adaptive_threshold.py

      - name: Enforcement
        run: |
          python - << 'PY'
import json
from pathlib import Path

data = json.loads(Path("outputs/runtime_signal/runtime_adaptive_summary.json").read_text())

score = data["latest_score"]
threshold = data["adaptive_threshold"]
fail = data["fail"]

print(f"score={score}")
print(f"threshold={threshold}")
print(f"fail={fail}")

if fail:
    raise SystemExit(f"❌ FAIL: {score} < {threshold}")
else:
    print("✅ PASS")
PY
