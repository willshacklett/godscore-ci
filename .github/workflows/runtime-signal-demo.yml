name: Runtime Signal Demo

on:
  workflow_dispatch:
  pull_request:

jobs:
  runtime-demo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt

      - name: Run runtime signal
        run: |
          python scripts/runtime_signal.py examples/runtime_signal_input.csv

      - name: Runtime badge summary
        run: |
          python - <<'PY2'
          import json, os
          from pathlib import Path

          data = json.loads(Path("outputs/runtime_signal/runtime_signal_input_summary.json").read_text())

          score = int(data.get("godscore_runtime", 100))
          warned = data.get("warned")
          t = data.get("first_warning_t")

          if score >= 80:
              badge = "SAFE"
          elif score >= 50:
              badge = "AT RISK"
          else:
              badge = "CRITICAL"

          lines = [
              "# GodScore Runtime Summary",
              "",
              f"- Badge: **{badge}**",
              f"- Score: **{score}**",
              f"- Warned: **{warned}**",
              f"- First Warning t: **{t}**",
          ]

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")

          print("\n".join(lines))
          PY2

      - name: PR Runtime Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const data = JSON.parse(
              fs.readFileSync('outputs/runtime_signal/runtime_signal_input_summary.json', 'utf8')
            );

            const score = data.godscore_runtime || 100;
            const warned = data.warned;
            const t = data.first_warning_t;

            let badge = "SAFE";
            if (score < 50) badge = "CRITICAL";
            else if (score < 80) badge = "AT RISK";

            const body = `## 🔍 GodScore Runtime Signal

Status: ${badge}
Score: ${score}
Warned: ${warned}
First Warning t: ${t}

${score < 50 ? "❌ High irreversibility risk detected" : ""}
${score >= 50 && score < 80 ? "⚠ Early warning signal detected" : ""}
${score >= 80 ? "✅ System trajectory stable" : ""}
`;

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
