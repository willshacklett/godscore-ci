name: Runtime Signal Demo

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  runtime:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-runtime.txt

      - name: Run runtime signal
        run: |
          python scripts/runtime_signal.py examples/runtime_signal_input.csv

      - name: Run drift check
        run: |
          python scripts/runtime_drift_check.py

      - name: Run adaptive threshold
        run: |
          python scripts/runtime_adaptive_threshold.py

      - name: Run fusion
        run: |
          python scripts/runtime_fusion.py

      - name: Run GodScore (enforced)
        run: |
          python action_main.py
