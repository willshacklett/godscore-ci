<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>GodScore Runtime</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #05070b;
      color: #e8f0ff;
      font-family: Arial, sans-serif;
    }
    h1 {
      margin-top: 0;
      color: #39f5d2;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .card {
      background: #0d1320;
      border: 1px solid #1f2a44;
      border-radius: 10px;
      padding: 16px;
    }
    .label {
      font-size: 12px;
      color: #9fb3d1;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .value {
      font-size: 28px;
      font-weight: 700;
    }
    .safe { color: #3ddc97; }
    .warn { color: #ffb020; }
    .bad  { color: #ff5d73; }
    .history-row {
      padding: 10px 12px;
      border-bottom: 1px solid #18233a;
      font-family: Consolas, monospace;
      font-size: 13px;
    }
    .muted {
      color: #9fb3d1;
    }
    .error {
      white-space: pre-wrap;
      color: #ff8fa3;
      background: #1b0b12;
      border: 1px solid #5a1d2d;
      padding: 12px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <h1>Runtime Signal Dashboard</h1>

  <div id="status" class="grid"></div>

  <div class="card">
    <div class="label">History</div>
    <div id="history" class="muted">Loading...</div>
  </div>

  <div style="height:16px"></div>

  <div class="card">
    <div class="label">Debug</div>
    <div id="debug" class="muted">Waiting for data...</div>
  </div>

  <script>
    async function loadJson(path) {
      const res = await fetch(path, { cache: "no-store" });
      if (!res.ok) throw new Error(`Failed fetch ${path}: ${res.status}`);
      return res.json();
    }

    async function loadText(path) {
      const res = await fetch(path, { cache: "no-store" });
      if (!res.ok) throw new Error(`Failed fetch ${path}: ${res.status}`);
      return res.text();
    }

    function badgeClass(score, fail, drift) {
      if (fail || score < 50) return "bad";
      if (drift || score < 80) return "warn";
      return "safe";
    }

    async function main() {
      const debug = document.getElementById("debug");
      const status = document.getElementById("status");
      const historyEl = document.getElementById("history");

      try {
        const adaptive = await loadJson("./data/runtime_adaptive_summary.json");
        const drift = await loadJson("./data/runtime_drift_summary.json");
        const base = await loadJson("./data/runtime_signal_input_summary.json");
        const historyText = await loadText("./data/runtime_history.jsonl");

        debug.textContent =
          "Loaded:\n" +
          "- runtime_adaptive_summary.json\n" +
          "- runtime_drift_summary.json\n" +
          "- runtime_signal_input_summary.json\n" +
          "- runtime_history.jsonl";

        const score = adaptive.latest_score ?? base.godscore_runtime ?? "n/a";
        const threshold = adaptive.adaptive_threshold ?? "n/a";
        const volatility = adaptive.volatility ?? "n/a";
        const fail = !!adaptive.fail;
        const driftDetected = !!drift.drift_detected;
        const warned = !!base.warned;
        const firstWarning = base.first_warning_t ?? "None";

        const cls = badgeClass(score, fail, driftDetected);
        const badgeText = fail ? "FAIL" : (driftDetected ? "DRIFTING" : "PASS");

        status.innerHTML = `
          <div class="card">
            <div class="label">Runtime Status</div>
            <div class="value ${cls}">${badgeText}</div>
          </div>
          <div class="card">
            <div class="label">Runtime Score</div>
            <div class="value">${score}</div>
          </div>
          <div class="card">
            <div class="label">Adaptive Threshold</div>
            <div class="value">${threshold}</div>
          </div>
          <div class="card">
            <div class="label">Volatility</div>
            <div class="value">${volatility}</div>
          </div>
          <div class="card">
            <div class="label">Warned</div>
            <div class="value">${warned}</div>
          </div>
          <div class="card">
            <div class="label">First Warning t</div>
            <div class="value">${firstWarning}</div>
          </div>
        `;

        const rows = historyText.trim()
          ? historyText.trim().split("\n").map(line => JSON.parse(line))
          : [];

        if (!rows.length) {
          historyEl.textContent = "No runtime history found.";
          return;
        }

        historyEl.innerHTML = rows.map(r => `
          <div class="history-row">
            t_wall=${r.t_wall} | score=${r.score} | warned=${r.warned} | first_warning_t=${r.first_warning_t}
          </div>
        `).join("");
      } catch (err) {
        debug.innerHTML = `<div class="error">${String(err)}</div>`;
        historyEl.innerHTML = `<div class="error">Dashboard failed to load data.</div>`;
      }
    }

    main();
  </script>
</body>
</html>
